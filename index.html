<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Paragraf</title>
</head>
<body>
    <!-- Contoh tag p, hr, br -->
    <p>Ini adalah paragraf 1</p>
    <br>
    <p>Ini adalah <br> paragraf 2</p>
    <hr>

    <!-- Contoh tag b, i, dan u  -->
    <p><b>Selamat Datang</b> di kuliah <i>pemrograman web 1</i></p>
    <p>Nama saya <u>Aldi Pratama</u></p>
    <hr>

    <p>
        <strong>Pemgumuman</strong>, kuliah pemrograman web 1, Senin 12 Juli 2026
        <em>ditiadakan!</em>
    </p>
</body>
</html>
